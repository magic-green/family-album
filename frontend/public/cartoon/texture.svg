  <rect width="300" height="300" fill="#fffaf3"/>

  <!-- 稀疏分布，元素不跨边界，平铺无接缝 -->
  <use href="#c" xlink:href="#c" x="26" y="28"/>
  <use href="#s" xlink:href="#s" x="112" y="22"/>
  <use href="#h" xlink:href="#h" x="228" y="36"/>
  <use href="#f" xlink:href="#f" x="188" y="76"/>
  <use href="#d" xlink:href="#d" x="60" y="92"/>
  <use href="#p" xlink:href="#p" x="266" y="118" transform="rotate(-18 266 118)"/>
  <use href="#s" xlink:href="#s" x="18" y="152"/>
  <use href="#l" xlink:href="#l" x="120" y="136" transform="rotate(25 120 136)"/>
  <use href="#c" xlink:href="#c" x="214" y="160" transform="scale(0.8) translate(53 40)"/>
  <use href="#h" xlink:href="#h" x="86" y="212"/>
  <use href="#f" xlink:href="#f" x="252" y="238"/>
  <use href="#d" xlink:href="#d" x="160" y="258"/>
  <use href="#p" xlink:href="#p" x="34" y="262" transform="rotate(20 34 262)"/>
  <use href="#l" xlink:href="#l" x="196" y="286" transform="rotate(-30 196 286)"/>
  <use href="#s" xlink:href="#s" x="282" y="208" transform="scale(0.7) translate(120 90)"/>

  <!-- 极淡小圆点，增加一点节奏 -->
