<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="淡色卡通平铺背景：云朵、星星、小花、脚印、水滴">
  <defs>
