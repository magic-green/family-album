    <circle cx="76" cy="52" r="2.5"/>
    <circle cx="150" cy="96" r="2"/>
    <circle cx="240" cy="118" r="2.5"/>
    <circle cx="42" cy="196" r="2"/>
    <circle cx="132" cy="222" r="2.5"/>
    <circle cx="218" cy="262" r="2"/>
    <circle cx="278" cy="68" r="2"/>
  </g>
</svg>
