      <path d="M2 2 15 -2" stroke="#c3ddae" stroke-width="1.2"/>
    </g>
    <g id="p">
      <ellipse cx="0" cy="0" rx="4" ry="5" fill="#ffdfb9"/>
      <circle cx="-5" cy="-5" r="1.8" fill="#ffdfb9"/>
      <circle cx="0" cy="-7" r="1.8" fill="#ffdfb9"/>
      <circle cx="5" cy="-5" r="1.8" fill="#ffdfb9"/>
    </g>
    <g id="h">
