      <circle cx="15" cy="18" r="1.2" fill="#c9a98f"/>
      <circle cx="26" cy="18" r="1.2" fill="#c9a98f"/>
    </g>
    <g id="s">
      <path d="M0 -8 2 -2.5 8 -2 3.5 2 5 8 0 4.5 -5 8 -3.5 2 -8 -2 -2 -2.5z" fill="#ffe3ad"/>
    </g>
    <g id="f">
      <circle cx="0" cy="-6" r="4" fill="#ffe9e0"/>
      <circle cx="5.7" cy="-1.9" r="4" fill="#ffe9e0"/>
      <circle cx="3.5" cy="4.9" r="4" fill="#ffe9e0"/>
      <circle cx="-3.5" cy="4.9" r="4" fill="#ffe9e0"/>
      <circle cx="-5.7" cy="-1.9" r="4" fill="#ffe9e0"/>
      <circle cx="0" cy="0" r="3.2" fill="#ffd591"/>
    </g>
    <g id="d">
      <path d="M0 -8c5 7 8 10 8 14a8 8 0 0 1-16 0c0-4 3-7 8-14z" fill="#d8eef7"/>
    </g>
    <g id="l">
